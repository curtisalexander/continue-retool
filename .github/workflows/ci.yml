# Deterministic CI: every suite runs the servers directly and over the MCP
# protocol via fastmcp's in-process Client — no LLM, no Continue install.
# windows-latest exercises native Job Objects and both PowerShell generations.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: "0.11.21"
          python-version: "3.11"
      - name: Sync locked development environment
        run: uv sync --project continue-mcp --frozen --group dev
      - name: ruff
        run: uv run --project continue-mcp --no-sync ruff check continue-mcp

      - name: ty
        working-directory: continue-mcp
        run: >-
          uv run --no-sync ty check
          continue_mcp_common
          *-mcp/*_mcp
          install-workspace.py
          bench
          scripts

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cover every supported runner on the minimum Python, then exercise
          # the pinned current stable Python once to avoid tripling CI cost.
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: "0.11.21"   # pinned: a uv release must not silently change CI
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Sync committed lockfile
        if: runner.os != 'Windows'
        run: uv sync --project continue-mcp --frozen --extra test

      - name: Assert Windows command interpreters
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command cmd.exe -CommandType Application -ErrorAction Stop | Out-Null
          cmd.exe /d /c exit 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Command powershell.exe -CommandType Application -ErrorAction Stop | Out-Null
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command "exit 0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Command pwsh.exe -CommandType Application -ErrorAction Stop | Out-Null
          pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "exit 0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sync committed lockfile (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv sync --project continue-mcp --frozen --extra test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ripgrep is bring-your-own (search-mcp/pyproject.toml never depends on
      # it) — install the global prebuilt binary the same way the READMEs
      # tell a user to, so search-mcp's tests and the installer doctor's
      # "ripgrep resolves" check both have a real rg on PATH.
      - name: Install ripgrep
        if: runner.os != 'Windows'
        run: uv tool install ripgrep-bin==15.2.0

      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv tool install ripgrep-bin==15.2.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run all test suites
        if: runner.os != 'Windows'
        shell: bash
        run: uv run --project continue-mcp --no-sync python continue-mcp/scripts/run_server_tests.py

      - name: Run all test suites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run --project continue-mcp --no-sync python continue-mcp/scripts/run_server_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installer recovery and configuration tests
        if: runner.os != 'Windows'
        shell: bash
        run: uv run --project continue-mcp --no-sync pytest -q continue-mcp/tests

      - name: Installer recovery and configuration tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run --project continue-mcp --no-sync pytest -q continue-mcp/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Copies the toolkit and creates a workspace under paths containing both
      # spaces and Unicode, then runs the source installer + doctor and clean
      # wheel/sdist installs. The packaged smoke also invokes the installer.
      - name: Installer, doctor, wheel, and sdist release smoke tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          uv run --project continue-mcp --no-sync python continue-mcp/scripts/release_smoke.py "$RUNNER_TEMP/release smoke"

      - name: Installer, doctor, wheel, and sdist release smoke tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run --project continue-mcp --no-sync python continue-mcp/scripts/release_smoke.py "$env:RUNNER_TEMP/release smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $toolkit = Join-Path "$env:RUNNER_TEMP/release smoke" 'toolkit path 工具包'
          $workspace = Join-Path "$env:RUNNER_TEMP/release smoke" 'workspace path 工作区'
          uv run --project "$toolkit" --no-sync python "$toolkit/install-workspace.py" "$workspace" --no-sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --project "$toolkit" --no-sync python "$toolkit/install-workspace.py" "$workspace" --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Informational: resting token cost per tool + cold-start latency.
      # Watch this output drift across PRs; it is the toolkit's price tag.
      - name: Token + cold-start audit
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd continue-mcp
          uv run --no-sync --project . python bench/audit.py \
            --write-schema-metrics bench/schema-metrics.json
          git diff --exit-code bench/schema-metrics.json

  docs:
    # The Pages site serves COMMITTED HTML; fail if docs/ drifted from the
    # markdown sources (i.e. someone edited a .md without re-running pandoc).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install pandoc (pinned — HTML output must match local rebuilds)
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.10/pandoc-3.10-1-amd64.deb
          sudo dpkg -i pandoc-3.10-1-amd64.deb
      - name: Rebuild docs and diff
        run: |
          set -euo pipefail
          python continue-mcp/scripts/sync_metadata.py --check
          ./build/build-docs.sh
          if ! git diff --exit-code docs/; then
            echo "docs/ is stale — run ./build/build-docs.sh and commit" >&2
            exit 1
          fi
